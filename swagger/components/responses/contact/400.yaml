description: Bad request
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Validation failed
        data:
          type: object
          required:
            - errors
          properties:
            errors:
              type: object
              additionalProperties:
                type: string
              example:
                name: Name must be at least 2 characters long
                phoneNumber: Phone number is not in a valid format
                contactType: Contact Type is required
