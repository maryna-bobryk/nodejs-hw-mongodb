description: Successfully found contacts!
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Successfully found contacts
        data:
          type: object
          required:
            - contacts
            - page
            - perPage
            - totalItems
            - totalPages
            - hasPreviousPage
            - hasNextPage
          properties:
            contacts:
              type: array
              items:
                $ref: ../../schemas/contacts.yaml
            page:
              type: integer
              example: 2
            perPage:
              type: integer
              example: 5
            totalItems:
              type: integer
              example: 10
            totalPages:
              type: integer
              example: 15
            hasNextPage:
              type: boolean
              example: false
            hasPreviousPage:
              type: boolean
              example: true
