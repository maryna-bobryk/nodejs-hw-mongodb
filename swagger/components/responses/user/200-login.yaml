description: Successfully logged in an user
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Successfully logged in a user
        data:
          type: object
          required:
            - accessToken
          properties:
            accessToken:
              type: string
              example: xsPX0iCiu4QahQvRmg2JbqCgAEEOs1h+Qg+GZcEq
