type: object
required:
  - name
  - email
  - password
properties:
  name:
    description: "Users's name"
    type: string
    example: 'John Doe'

  email:
    description: "User's email address"
    type: string
    example: 'johndoe@mail.com'

  password:
    description: "User's password"
    type: string
    example: '#tZaMqWoku45'

  createdAt:
    type: string
    format: date-time
    description: 'Date when the user was created'
    example: '2025-07-10T11:23:30.804Z'

  updatedAt:
    type: string
    format: date-time
    description: 'Date when the user was last updated'
    example: '2025-07-10T11:23:30.804Z'
