tags:
  - Auth
summary: Reset user password
operationId: resetPassword
description: Resets the user's password using a secure token and new password.
security: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - token
          - password
        properties:
          token:
            type: string
            description: JWT token for password reset
            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.bGciOiJIUzI1NiIsInR5cGciOiJICI6IkpXVCJ9.GciOiJIUzI1NiIsI1NiIsInR5cCI6IkpXVCJ9
          password:
            type: string
            description: New password for the user
            example: MyNewStr0ngPa55word!
responses:
  '200':
    description: Password has been successfully reset.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Password has been successfully reset.
            data:
              type: object
              example: {}
  '400':
    $ref: ../../components/responses/user/400-validation-error.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    $ref: ../../components/responses/user/404-user-not-found.yaml
