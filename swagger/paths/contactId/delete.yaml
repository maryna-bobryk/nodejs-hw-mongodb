tags:
  - Contacts
summary: Delete contact by ID
operationId: deleteContactById
description: Delete a contact by its ID. Authorization is required.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    description: ID of the contact to delete
    schema:
      type: string
      example: 65e4decdd286b30065d54af8
responses:
  '204':
    description: Contact successfully delete.
  '401':
    $ref: ../../components/responses/401.yaml
  '404':
    $ref: ../../components/responses/contact/404.yaml
