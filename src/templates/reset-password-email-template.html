<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Password</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        padding: 40px;
      }
      h1 {
        color: #2c3e50;
      }
      p {
        color: #555555;
        line-height: 1.6;
        font-size: 16px;
      }
      .button {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 24px;
        background-color: #3498db;
        color: #ffffff;
        text-decoration: none;
        border-radius: 5px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Hello {{name}},</h1>
      <p>
        Looks like you forgot your password... 🤔 Don't worry, it happens to the
        best of us!
      </p>
      <p>
        Just click the big shiny button below and you'll be on your way to
        creating a brand-new, unforgettable password.
      </p>

      <a href="{{link}}" class="button">Reset Password</a>
    </div>
  </body>
</html>
